# Build the dashboard on a schedule and publish it to GitHub Pages.
#
# The whole point is that the phone never waits: all the expensive work (fetch
# 587 player summaries, fit six models, solve the squad and chip MILPs) happens
# here, and what reaches the phone is flat JSON on a CDN.
#
# Runtime is roughly 3-4 minutes with the pip cache warm.
#
# Hourly is affordable only because this repo is PUBLIC: public repos get
# unlimited Actions minutes. A private repo gets 2,000 free minutes a month, and
# hourly (~720 runs x 3-4 min) would blow through that in about a week — so if
# you ever switch this repo to private, drop back to something like
# "0 5,11,17,23 * * *" (every 6 hours, ~480 min/month).

name: publish

on:
  schedule:
    # Every hour, on the hour, UTC. Hourly matters most around price changes
    # (00:00 UK) and on the run-up to a deadline, when injury news and flags
    # move through the FPL API during the day.
    - cron: "0 * * * *"
  # Build on demand from the Actions tab — use this before a deadline once the
  # team news lands, because a scheduled build cannot know about a press
  # conference that happened twenty minutes ago.
  workflow_dispatch:
  push:
    branches: [main]
    # Only rebuild on a push that could change the output.
    paths:
      - "gaffer/**"
      - "requirements.txt"
      - ".github/workflows/publish.yml"

# Pages needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled run and a manual run publish over each other. The manual
# one is the urgent one, so let it finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bookmaker odds are optional but rate-limited: the free tier allows 500
      # requests a month and this workflow runs 720 times. One request covers
      # every upcoming fixture, and the code refetches only when its cache is
      # older than six hours — but CI starts with an empty filesystem every run,
      # so without restoring that cache each build would look "cold" and fetch.
      #
      # The key changes once per 6-hour bucket. Inside a bucket the exact key
      # hits and the cached odds are reused; when the bucket rolls over there is
      # no exact hit, restore-keys supplies the previous (now stale) cache, the
      # code sees it is over six hours old and fetches once. That is ~120
      # requests a month, comfortably inside the free tier.
      - name: Work out the odds cache bucket
        id: oddsbucket
        run: echo "key=$(( $(date -u +%s) / 21600 ))" >> "$GITHUB_OUTPUT"

      - name: Restore cached odds
        uses: actions/cache@v4
        with:
          path: data/cache/odds_epl.json
          key: odds-${{ steps.oddsbucket.outputs.key }}
          restore-keys: odds-

      # The FPL API is the one thing here that can fail for reasons outside this
      # repo. Fail loudly and early rather than publishing a half-built site.
      - name: Check the scoring rules still match the live API
        run: python -m gaffer.core.scoring --verify

      - name: Build the site
        # ODDS_API_KEY is optional. Unset, the model runs on its own fitted
        # ratings and the build is identical to before. Set as a repository
        # secret, the betting market overrides the fixture forecast where prices
        # exist. The key is never written into the exported site — only the
        # derived goal rates ship.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m gaffer.cli export --out site --horizon 6

      # A published site that silently lost its data is worse than a failed
      # build, because it still looks fine on the phone.
      - name: Sanity-check the build
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/data/manifest.json
          test -f site/data/optimize.json
          test -f site/data/players.json
          players=$(python -c "import json;print(json.load(open('site/data/manifest.json'))['players_exported'])")
          echo "player breakdowns: $players"
          test "$players" -gt 400
          du -sh site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

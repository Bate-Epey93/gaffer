[pytest]
testpaths = tests
norecursedirs = .venv .git .claude data reports node_modules
addopts = -ra --strict-markers
markers =
    slow: takes more than a second (real MILP solves, whole-season simulation)
    livedata: needs the warm data/cache; skipped when it is absent
filterwarnings =
    ignore::DeprecationWarning:urllib3.*
    # This macOS python is linked against LibreSSL; urllib3 says so on import.
    ignore:urllib3 v2 only supports OpenSSL
    # PuLP 3.3 warns on its own 4.0 API change on every LpVariable; gaffer builds
    # tens of thousands of them per solve and the noise buries the summary.
    ignore:.*LpVariable.*:DeprecationWarning
    ignore:.*LpProblem.constraints.*:DeprecationWarning
